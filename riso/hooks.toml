# Declared, re-appliable insertions into upstream files.
# [[hooks]]
# id = "riso-init"
# file = "crates/zed/src/main.rs"
# anchor = "settings_ui::init(cx);"
# position = "after"
# text = "        riso::init(app_state.clone(), cx);"

[[hooks]]
id = "jev-init"
file = "crates/zed/src/main.rs"
anchor = "        project::Project::init(&client, cx);"
position = "after"
text = """        jev::init(
            node_runtime.clone(),
            fs.clone(),
            jev_shell_env_loaded_rx,
            cx,
        );"""

[[hooks]]
id = "crew-model-catalog-init"
file = "crates/zed/src/main.rs"
anchor = "        settings_ui::init(cx);"
position = "after"
text = "        crew_model_catalog::init(app_state.clone(), cx);"

[[hooks]]
id = "crew-quota-init"
file = "crates/zed/src/main.rs"
anchor = "        crew_model_catalog::init(app_state.clone(), cx);"
position = "after"
text = "        crew_quota::init(app_state.clone(), cx);"

[[hooks]]
id = "crew-quota-http"
file = "crates/zed/src/main.rs"
anchor = "        cx.set_http_client(Arc::new(http));"
position = "after"
text = "        crew_quota::install_http_observer(cx);"
