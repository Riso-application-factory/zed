name: Riso CI
run-name: CI for ${{ github.event.pull_request.title || format('push to {0}', github.ref_name) }}
on:
  pull_request:
    branches: [riso/main]
  push:
    branches: [riso/main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  preflight:
    name: 'Preflight: decide whether to run'
    if: github.repository_owner != 'zed-industries'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-checks: ${{ steps.gate.outputs.run-checks }}
    steps:
      - name: Skip pushes that come from a merged pull request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != push ]; then
            echo 'run-checks=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Matching merge_commit_sha covers merge, squash and rebase merges; fail open so an API error never skips checks.
          if ! merged_pull_request=$(gh api "repos/$GH_REPO/commits/$COMMIT_SHA/pulls" --jq "map(select(.merged_at != null and .merge_commit_sha == \"$COMMIT_SHA\")) | .[0].number // empty"); then
            echo '::warning::Could not look up pull requests for this commit; running checks.'
            echo 'run-checks=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$merged_pull_request" ]; then
            echo "Commit $COMMIT_SHA was merged through pull request #$merged_pull_request; its checks already ran on the pull request."
            echo 'run-checks=false' >> "$GITHUB_OUTPUT"
          else
            echo "Commit $COMMIT_SHA was pushed directly; running checks."
            echo 'run-checks=true' >> "$GITHUB_OUTPUT"
          fi
  lint:
    name: 'Lint: workflows and formatting'
    needs: preflight
    if: needs.preflight.outputs.run-checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Download actionlint
        id: actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - name: Lint riso workflows
        env:
          ACTIONLINT: ${{ steps.actionlint.outputs.executable }}
        run: '"$ACTIONLINT" -color .github/workflows/riso_*.yml'
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
  adr-policy:
    name: 'Policy: ADR coverage'
    needs: preflight
    if: needs.preflight.outputs.run-checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/zed-industries/zed.git
          git fetch upstream main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check ADR coverage
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.head_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          arguments = ['python3', 'riso/sync/riso_sync.py', 'check']
          if os.environ['EVENT_NAME'] == 'pull_request':
              body = Path(os.environ['RUNNER_TEMP']) / 'pr-body.md'
              body.write_text(os.environ.get('PR_BODY', ''))
              arguments.extend(['--pr-body-file', str(body)])
              labels = json.loads(os.environ.get('PR_LABELS') or '[]') or []
              if os.environ['PR_HEAD'].startswith('riso/sync/') and 'riso-sync' in labels:
                  arguments.append('--sync-pr')
          raise SystemExit(subprocess.run(arguments).returncode)
          PY
  clippy:
    name: 'Lint: clippy on fork-owned crates'
    # Waits for the one-minute lint job so broken formatting or workflows skip this expensive job; the ADR policy
    # is deliberately not a prerequisite because it fails until a human removes the review marker.
    needs: [preflight, lint]
    if: needs.preflight.outputs.run-checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: ./script/linux
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run clippy
        run: ./script/clippy -p jev
  build-and-test:
    name: 'Build and test: Zed and ADR contracts'
    # Waits for the one-minute lint job so broken formatting or workflows skip this expensive job; the ADR policy
    # is deliberately not a prerequisite because it fails until a human removes the review marker.
    needs: [preflight, lint]
    if: needs.preflight.outputs.run-checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: ./script/linux
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build Zed
        run: cargo check -p zed --locked
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run ADR contract tests
        run: python3 riso/sync/riso_sync.py contracts run
  ci-passed:
    name: Riso CI passed
    needs: [preflight, lint, adr-policy, clippy, build-and-test]
    if: ${{ !cancelled() && github.repository_owner != 'zed-industries' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every check to pass or be intentionally skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          run_checks=$(jq -r '.preflight.outputs["run-checks"] // ""' <<< "$NEEDS")
          failed=$(jq -r --arg run_checks "$run_checks" '
            to_entries[]
            | select(.value.result != "success")
            | select(.key == "preflight" or .value.result != "skipped" or $run_checks != "false")
            | "\(.key): \(.value.result)"
          ' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            printf 'Checks that did not pass:\n%s\n' "$failed"
            exit 1
          fi
          echo 'All checks passed or were skipped for a merged pull request.'
  notify-failure:
    name: 'Notify: riso/main failure'
    needs: ci-passed
    if: ${{ !cancelled() && github.repository_owner != 'zed-industries' && github.event_name == 'push' && needs.ci-passed.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open an issue for the failed product branch check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Kiểm tra trên nhánh sản phẩm thất bại.\n\nXem chi tiết: %s\n' "$RUN_URL" > "$RUNNER_TEMP/check-failure.md"
          gh issue create --title 'Kiểm tra trên riso/main thất bại' --body-file "$RUNNER_TEMP/check-failure.md"
