name: Riso checks
on:
  pull_request:
    branches: [riso/main]
  push:
    branches: [riso/main]
permissions:
  contents: read
jobs:
  riso-adr:
    if: github.repository_owner != 'zed-industries'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/zed-industries/zed.git
          git fetch upstream main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ADR coverage
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.head_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          arguments = ['python3', 'riso/sync/riso_sync.py', 'check']
          if os.environ['EVENT_NAME'] == 'pull_request':
              body = Path(os.environ['RUNNER_TEMP']) / 'pr-body.md'
              body.write_text(os.environ.get('PR_BODY', ''))
              arguments.extend(['--pr-body-file', str(body)])
              labels = json.loads(os.environ.get('PR_LABELS') or '[]') or []
              if os.environ['PR_HEAD'].startswith('riso/sync/') and 'riso-sync' in labels:
                  arguments.append('--sync-pr')
          raise SystemExit(subprocess.run(arguments).returncode)
          PY
  riso-verify:
    if: github.repository_owner != 'zed-industries'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        run: ./script/linux
      - uses: Swatinem/rust-cache@v2
      - name: Check Zed
        run: cargo check -p zed --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ADR contracts
        run: python3 riso/sync/riso_sync.py contracts run
  riso-report-failure:
    if: always() && github.repository_owner != 'zed-industries' && github.event_name == 'push' && (needs.riso-adr.result == 'failure' || needs.riso-verify.result == 'failure')
    needs: [riso-adr, riso-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report product branch check failure
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Kiểm tra trên nhánh sản phẩm thất bại.\n\nXem chi tiết: %s\n' "$RUN_URL" > "$RUNNER_TEMP/check-failure.md"
          gh issue create --title 'Kiểm tra trên riso/main thất bại' --body-file "$RUNNER_TEMP/check-failure.md"
